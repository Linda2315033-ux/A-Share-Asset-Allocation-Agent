name: A-share daily research V2 (manual validation)

on:
  workflow_dispatch:
  # Enable ONLY after successful end-to-end manual validation:
  # schedule:
  #   - cron: '30 9 * * 1-5' # 17:30 Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: a-share-daily-research-v2
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and GitHub CLI
        run: |
          python -m pip install -r requirements.txt
          gh --version
      - name: Restore latest complete private data
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DATA_READ_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Missing PRIVATE_DATA_READ_TOKEN'; exit 1; }
          python stock_agent_github_restore_latest_v2.py restore
      - name: Update market data and generate research preview
        run: python stock_agent_daily_automation_v3.py --daily-update --confirm-daily-update --timeout 9000
      - name: Verify newly generated research preview
        run: python stock_agent_verify_daily_v2.py
      - name: Create immutable private backup (before public publishing)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DATA_WRITE_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Missing PRIVATE_DATA_WRITE_TOKEN'; exit 1; }
          python stock_agent_github_backup_v1.py --date "$(cat verified_trade_date.txt)" --confirm
      - name: Stage only validated public research JSON
        run: python stock_agent_publish_preview_v1.py
      - name: Commit research preview (no private market data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- published_preview/
          if git diff --cached --quiet; then
            echo 'No new preview to publish'
          else
            git commit -m "Publish research preview [skip ci]"
            git push origin HEAD:main
          fi
      - name: Completed
        run: echo 'DAILY_V2_BACKUP_AND_PUBLIC_PREVIEW_OK'
